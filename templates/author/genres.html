{% extends "base.html" %}
{% block title %}Manage Genres{% endblock %}
{% block content %}
<div class="admin-layout">
  <div class="admin-sidebar">
    <a href="{{ url_for('author.dashboard') }}">My Comics</a>
    <a href="{{ url_for('author.create_comic') }}">Create Comic</a>
    <a href="{{ url_for('author.manage_genres') }}" class="active">Genres</a>
  </div>
  <div class="admin-content">
    <h2 style="margin-bottom:24px">Manage Genres</h2>

    <form method="POST" action="{{ url_for('author.create_genre') }}" style="display:flex;gap:8px;margin-bottom:24px;flex-wrap:wrap;align-items:end">
      <div class="form-group" style="margin:0;flex:1;min-width:150px">
        <label style="font-size:12px">Name (EN)</label>
        <input type="text" name="name_en" class="form-input" required placeholder="Action">
      </div>
      <div class="form-group" style="margin:0;flex:1;min-width:150px">
        <label style="font-size:12px">Name (ID)</label>
        <input type="text" name="name_id" class="form-input" required placeholder="Aksi">
      </div>
      <button type="submit" class="btn btn-primary" style="padding:8px 20px">+ Add Genre</button>
    </form>

    <table class="table">
      <thead><tr><th>English</th><th>Indonesian</th><th>Action</th></tr></thead>
      <tbody>
        {% for genre in genres %}
        <tr>
          <td>{{ genre.name_en }}</td>
          <td>{{ genre.name_id }}</td>
          <td>
            <form method="POST" action="{{ url_for('author.delete_genre', id=genre.id) }}" style="display:inline" onsubmit="return confirm('Delete genre {{ genre.name_en }}?')">
              <button type="submit" class="btn btn-danger" style="padding:4px 12px;font-size:12px">Delete</button>
            </form>
          </td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
</div>
{% endblock %}
