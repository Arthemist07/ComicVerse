{% extends "base.html" %}
{% block title %}Add Chapter{% endblock %}
{% block content %}
<div class="admin-layout">
  <div class="admin-sidebar">
    <a href="{{ url_for('author.dashboard') }}">My Comics</a>
    <a href="{{ url_for('author.create_comic') }}">Create Comic</a>
  </div>
  <div class="admin-content">
    <h2 style="margin-bottom:8px">Add Chapter - {{ comic.title_en }}</h2>
    <a href="{{ url_for('author.chapters', comic_id=comic.id) }}" style="color:var(--accent);font-size:14px;display:inline-block;margin-bottom:24px">← Back to Chapters</a>
    <form method="POST" enctype="multipart/form-data" style="max-width:600px">
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px">
        <div class="form-group"><label>Chapter Number</label><input type="number" step="0.5" name="number" class="form-input" required></div>
        <div class="form-group"><label>Title (EN)</label><input type="text" name="title_en" class="form-input"></div>
      </div>
      <div class="form-group"><label>Title (ID)</label><input type="text" name="title_id" class="form-input"></div>
      <div class="form-group">
        <label>Upload Pages (images)</label>
        <input type="file" name="page_files" multiple accept="image/*" class="form-input" style="padding:8px">
        <div style="font-size:12px;color:var(--text-secondary);margin-top:4px">Select multiple images at once. Supported: PNG, JPG, WebP</div>
      </div>
      <div class="form-group">
        <label>Or paste page URLs (one per line)</label>
        <textarea name="pages" class="form-textarea" rows="6" placeholder="https://example.com/page1.jpg"></textarea>
      </div>
      <button type="submit" class="btn btn-primary">Save Chapter</button>
    </form>
  </div>
</div>
{% endblock %}
