{% extends "base.html" %}
{% block title %}{{ _('register') }}{% endblock %}
{% block content %}
<div class="auth-page">
  <div class="auth-card">
    <h2>{{ _('join_us') }}</h2>
    <p>{{ _('create_account') }}</p>
    <form method="POST">
      <div class="form-group">
        <label>{{ _('username') }}</label>
        <input type="text" name="username" class="form-input" required>
      </div>
      <div class="form-group">
        <label>{{ _('email') }}</label>
        <input type="email" name="email" class="form-input" required>
      </div>
      <div class="form-group">
        <label>{{ _('password') }}</label>
        <input type="password" name="password" class="form-input" required minlength="6">
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;padding:12px">{{ _('register') }}</button>
    </form>
    <p style="text-align:center;margin-top:16px;font-size:14px">
      {{ _('have_account') }} <a href="{{ url_for('auth.login') }}" style="color:var(--accent)">{{ _('sign_in') }}</a>
    </p>
  </div>
</div>
{% endblock %}
