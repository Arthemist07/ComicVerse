{% extends "base.html" %}
{% block title %}{{ _('sign_in') }}{% endblock %}
{% block content %}
<div class="auth-page">
  <div class="auth-card">
    <h2>{{ _('welcome_back') }}</h2>
    <p>{{ _('sign_in') }} {{ 'to' }} {{ get_setting('site_name_en') or 'ComicVerse' }}</p>
    <form method="POST">
      <div class="form-group">
        <label>{{ _('email') }}</label>
        <input type="email" name="email" class="form-input" required>
      </div>
      <div class="form-group">
        <label>{{ _('password') }}</label>
        <input type="password" name="password" class="form-input" required>
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;padding:12px">{{ _('sign_in') }}</button>
    </form>
    <p style="text-align:center;margin-top:16px;font-size:14px">
      {{ _('no_account') }} <a href="{{ url_for('auth.register') }}" style="color:var(--accent)">{{ _('register') }}</a>
    </p>
  </div>
</div>
{% endblock %}
